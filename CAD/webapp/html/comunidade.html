    <main>

    </main>
    <button commandfor="accessibilityMenu" command="show-modal" id="accessibilityButton" class="accessibility-button"
        aria-label="Abrir menu de acessibilidade" aria-controls="accessibilityMenu" aria-expanded="false">

        A
    </button>

     <!-- menu -->
    <dialog id="accessibilityMenu" class="accessibility-menu" aria-labelledby="accessibility-title">

        <header class="accessibility-header">
            <h2 id="accessibility-title">Menu de acessibilidade</h2>

            <button type="button" commandfor="accessibilityMenu" command="close" class="close-accessibility">
                X
            </button>

        </header>

        <div class="accessibility-content">

            <!-- TEXTO -->
            <section class="accessibility-card" aria-labelledby="text-title">
                <div class="image-title-section">
                    <h1>A</h1>
                    <h3 class="menu-title-section">Texto</h3>
                </div>
                <div class="control-group">
                    <label for="font-size-slider">Tamanho da fonte</label>
                    <div class="font-controls">
                        <button id="font-decrease" aria-label="Diminuir tamanho da fonte">A-</button>
                        <output id="font-value">100%</output>
                        <button id="font-increase" aria-label="Aumentar tamanho da fonte">A+</button>
                    </div>
                </div>
            </section>

            <!-- TEMA -->
            <section class="accessibility-card" aria-labelledby="theme-title">
                <div class="image-title-section">
                    <img src="../assets/icons/moon.png"
                        alt="Imagem de uma paleta de cores, para indicar ao usuário que esta na " class="icon-section">
                    <h3 class="menu-title-section">Tema</h3>
                </div>
                <fieldset class="segmented">
                    <button>Claro</button>
                    <button class="selected">Escuro</button>
                </fieldset>
            </section>

            <!-- CONTRASTE -->
            <section class="accessibility-card" aria-labelledby="contrast-title">
                <div class="image-title-section">
                    <img src="../assets/icons/negative-balance (1) 1.png"
                        alt="Icone do modo escuro, referência a mudança " class="icon-section">
                    <h3 class="menu-title-section">Contraste</h3>
                </div>
                <fieldset class="segmented">
                    <button class="selected">Padrão</button>
                    <button>Alto contraste</button>
                </fieldset>
            </section>

            <!-- DALTONISMO -->
            <section class="accessibility-card" aria-labelledby="color-title">
                <div class="image-title-section">
                    <img src="../assets/icons/negative-balance (1) 1.png"
                        alt="Icone do modo escuro, referência a mudança " class="icon-section">
                    <h3 class="menu-title-section">Modo de cores</h3>
                </div>
                <div class="grid-buttons">
                    <button>Normal</button>
                    <button>Deuteranopia</button>
                    <button>Protanopia</button>
                    <button>Tritanopia</button>
                </div>
            </section>

            <!-- CORES -->
            <section class="accessibility-card" aria-labelledby="custom-color-title">
                <div class="image-title-section">
                    <img src="../assets/icons/eye-drops 1.png" alt="Icone do modo escuro, referência a mudança "
                        class="icon-section">
                    <h3 class="menu-title-section">Personalizar cores</h3>
                </div>
                <div class="color-picker">
                    <label>Cor principal
                        <input type="color" id="primaryColor">
                    </label>
                    <label>Cor de fundo
                        <input type="color" id="backgroundColor">
                    </label>
                </div>
            </section>

            <!-- LEITURA -->

            <section class="accessibility-card" aria-labelledby="reading-title">
                <div class="image-title-section">
                    <img src="../assets/icons/negative-balance (1) 1.png"
                        alt="Icone do modo escuro, referência a mudança " class="icon-section">
                    <h3 class="menu-title-section">Leitura</h3>
                </div>
                <div class="switch-group">
                    <label>
                        <input type="checkbox" id="readingMode">
                        <span>Modo leitura</span>
                    </label>
                    <label>
                        <input type="checkbox" id="hideImages">
                        <span>Ocultar imagens</span>
                    </label>
                    <label>
                        <input type="checkbox" id="largeCursor">
                        <span>Cursor grande</span>
                    </label>
                </div>
            </section>

            <!-- VOZ -->
            <section class="accessibility-card" aria-labelledby="voice-title">
                <div class="image-title-section">
                    <img src="../assets/icons/volume-up.png" alt="Icone do modo escuro, referência a mudança "
                        class="icon-section">
                    <h3 class="menu-title-section">Voz</h3>
                </div>
                <div class="switch-group">
                    <label>
                        <input type="checkbox" id="screenReader">
                        <span>Narrar interface</span>
                    </label>
                    <label>
                        <input type="checkbox" id="autoReadLinks">
                        <span>Ler links automaticamente</span>
                    </label>
                </div>
            </section>

            <!-- ANIMAÇÕES -->
            <section class="accessibility-card" aria-labelledby="motion-title">
                <div class="image-title-section">
                    <img src="../assets/icons/volume-up.png" alt="Icone do modo escuro, referência a mudança "
                        class="icon-section">
                    <h3 class="menu-title-section">Movimento</h3>
                </div> 
                <label>
                    <input type="checkbox" id="reduceMotion">
                    Reduzir animações
                </label>
            </section>

            <!-- FOCO -->
            <section class="accessibility-card" aria-labelledby="focus-title">
                <div class="image-title-section">
                    <img src="../assets/icons/volume-up.png" alt="Icone do modo escuro, referência a mudança "
                        class="icon-section">
                    <h3 class="menu-title-section">Navegação</h3>
                </div> 
                <label>
                    <input type="checkbox" id="highlightFocus">
                    Destacar foco do teclado
                </label>
            </section>
        </div>

        <footer class="accessibility-footer">
            <button id="resetAccessibility">Restaurar padrões</button>
        </footer>

    </dialog>
</body>

</html>
